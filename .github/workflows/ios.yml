name: Build iOS IPA
on:
  push:
    branches: [main, codex/native-ios-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      # Xcode 16.4 / iOS 18.5 has a known libswiftWebKit simulator loader bug.
      # https://bugs.webkit.org/show_bug.cgi?id=293831
      - name: Select tested Xcode runtime
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:engine
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and icon
        run: |
          sips -z 1024 1024 ios/FoodDelivery/Assets.xcassets/AppIcon.appiconset/Icon.png
          cd ios && xcodegen generate
      - name: Pick installed iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for runtime,group in d["devices"].items() if runtime.endswith("iOS-18-2") for v in group if v["isAvailable"] and v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: iOS simulator tests
        run: |
          set -o pipefail
          xcodebuild test -parallel-testing-enabled NO -project ios/FoodDelivery.xcodeproj -scheme FoodDelivery -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build-tests.log
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - name: Build real-device app
        run: |
          set -o pipefail
          xcodebuild -project ios/FoodDelivery.xcodeproj -scheme FoodDelivery -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build-device.log
      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/FoodDelivery.app build/package/Payload/
          test -f build/package/Payload/FoodDelivery.app/FoodDelivery
          cd build/package
          zip -qry ../FoodDelivery-unsigned.ipa Payload
          cd ..
          shasum -a 256 FoodDelivery-unsigned.ipa > SHA256SUMS.txt
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoodDelivery-IPA
          path: |
            build/FoodDelivery-unsigned.ipa
            build/SHA256SUMS.txt
          retention-days: 90
      - name: Test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results
          path: |
            build/Tests.xcresult
            build/screenshots
            build-*.log
          retention-days: 30
